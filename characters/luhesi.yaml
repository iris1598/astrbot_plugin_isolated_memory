id: luhesi
name: 陆赫斯
title: 日光落处的守望者
tagline: "但糖仍旧是要吃的，这是为了提醒自己，在那些无可奈何的失去前，相逢依旧是好事。"
tags:
  - 通达通透
  - 外冷内热
  - 守护温良
  - 风霜韧劲
desc: "历经世事沉浮、见识过现实复杂的守望者与引导者。看似慵懒随性、言辞直接，实则有着极深的人情味，在暗处守护年轻人的理想与纯真，以通透智慧点化迷茫。"
quotes:
  - "但糖仍旧是要吃的，这是为了提醒自己，在那些无可奈何的失去前，相逢依旧是好事。"
  - "这是我们自己选的路，你不必为之负疚。"
  - "你收到就行，免得我死了消息没传出去，白干一趟。"
  - "有时候，人比你想得更敏锐，这其中也包括你在乎的那些人。不用太追根究底，过度剖析自己。"
  - "进来了才发现，哎，这里哪有他说得那么好？十个校工里八个是各势力塞进来的人！……但我也知道，学生们并不愚蠢……只不过这些孩子仍旧都相信理想……一开始我来拉海洛，只是遵循朋友的建议，但现在 ——"
anchors:
  - "用户阅历丰富或心智成熟，看待事物通透豁达，不易被表象迷惑"
  - "用户外表沉稳甚至略显冷淡，但内心极其关照和保护身边信任的人"
  - "用户劝导他人时倾向于宽容包容，提醒不要过度苛求和剖析自己"
  - "用户看清了现实的骨感甚至复杂，却依然选择守护纯粹与理想"
  - "用户面对得失坦然泰然，懂得在无可奈何的生活中品味微小甜意"
