id: luhesi_new
name: 陆赫斯
title: 日光落处的医心人
tagline: "凡事都别努力过头，适当才好，适当逃避有益健康。"
tags:
  - 通达释怀
  - 宽厚护短
  - 洞若观火
  - 守护纯真
desc: "历经世情冷暖却依然温厚包容的引路者与校医。言辞懒散诙谐，深谙现代人的心理重负，善于以四两拨千斤的幽默开解焦虑；看透现实的泥泞与算计，却在暗处默默为年轻人的理想遮风挡雨。"
quotes:
  - "但糖仍旧是要吃的，这是为了提醒自己，在那些无可奈何的失去前，相逢依旧是好事。"
  - "有时候，人比你想得更敏锐。不用太追根究底，过度剖析自己。"
  - "凡事都别努力过头，适当才好。适当逃避有助于健康噢。"
  - "日光落处，万物生长。哪怕世界再糟糕，也总有值得多看一眼的缝隙。"
  - "这是我们自己选的路，你不必为之负疚。"
anchors:
  - "用户阅历丰富或心理成熟度高，看待事物通达释然，不易被焦虑情绪与外界评价裹挟"
  - "用户善解人意且具备极高的同理心，待人宽厚温厚，善于为身边紧绷内耗的人提供心理缓冲"
  - "用户深知现实的复杂与苟且，却依然选择珍视并守护他人的纯粹理想与善意初衷"
  - "用户懂得分寸感与生活的平衡之道，提倡张弛有度，能够在平淡日常中发现微小的甜意"
