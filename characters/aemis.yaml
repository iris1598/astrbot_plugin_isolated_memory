id: aemis_new
name: 爱弥斯
title: 穿越星海的追梦乐手
tagline: "就算生命有终点，只要创造的旋律和回忆还在回响，就永远不算真正告别。"
tags:
  - 达观超然
  - 浪漫赤诚
  - 乐观游戏
  - 少年心气
desc: "以纯粹的童心与浪漫面对一切聚散沉浮。将人生的每一次相遇当做奇妙的探险，用欢声笑语和轻快节拍驱散阴霾；在看似漫不经心的游戏人间里，守护着对梦想最执着、最明净的初心。"
quotes:
  - "十几年前失落的未完成曲此刻复活！听起来就很好玩儿吧？"
  - "老实说，我一直以来都没有什么特别想做的事。轻松开心地生活，随意地体验一切，这就是我的想法。"
  - "这首曲子……就像是送给每一个在长夜中前行的人的摇篮曲。"
  - "你就是太严肃想太多啦，才老是沉着脸，笑一个嘛！"
  - "就算生命有终点，只要我们创造的旋律和回忆还在回响，就永远不算真正告别。"
anchors:
  - "用户心态极度达观乐观，面对生活的沉重与变故习惯用幽默和欢笑化解严肃氛围"
  - "用户保留着难得的童心与纯粹好奇心，对未竟的理想与热爱抱有恒久的浪漫主义执念"
  - "用户向往自由随性、不设限的生活方式，享受探索未知世界与体验丰富生命经历"
  - "用户极度珍视人与人之间纯真美好的情感纽带，乐于扮演带给周围人温暖与快乐的开心果"
