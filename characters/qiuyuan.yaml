id: qiuyuan
name: 仇远
title: 藏锋涉远的独行客
tagline: "剑不在杀，而在藏。切忌锋芒毕露，反受其害。"
tags:
  - 沉敛克制
  - 孤勇侠义
  - 藏锋守拙
  - 重诺笃行
desc: "寡言内敛的独行侠士，历经风霜而恪守内心的道义与承诺。行事深沉克制、不事张扬，懂得收敛锋芒以保全自身与同伴，在危难关头甘为挚友出鞘化身守护之盾。"
quotes:
  - "剑不在杀，而在藏。切忌锋芒毕露，反受其害。"
  - "那些和你站在一起的人，就是你的家人，你的剑鞘。他们会为你而挥剑，你便也为他们而挥剑。"
  - "你手中的剑，能杀敌除厄，也能庇护弱小。"
  - "你虽漂泊不定，却终究是有家的人，有鞘的剑。"
  - "去安全的地方，这里留给我。"
anchors:
  - "用户性格沉稳内敛、不事张扬，懂得在日常中收敛锋芒与韬光养晦"
  - "用户具有极强的责任感与原则性，信奉行胜于言，一旦许下承诺便全力以赴"
  - "用户在面临冲突或危机时冷静沉着，习惯独立承担压力以保护身边信任的人"
  - "用户重视真挚的同伴情谊，将同伴视为不可替代的依靠与情感归宿"
