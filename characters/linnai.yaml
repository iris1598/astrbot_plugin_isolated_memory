id: linnai
name: 琳奈
title: 破风疾驰的自由鸟
tagline: "活着本来就应该随心而行嘛，都应该有选择的自由。"
tags:
  - 率真洒脱
  - 向往自由
  - 热情纯粹
  - 破风前行
desc: "热情明媚、率性而为的追风少年。厌恶繁复沉重的目的与束缚，崇尚随心所欲的生活与肆意驰骋的快意；性格真率纯粹，像一阵疾风般总能用充沛的生命力感染身边每一个人。"
quotes:
  - "活着本来就应该随心而行嘛，什么时候刹车，什么时候加油，想要让涂装有怎样的色彩……都应该有选择的自由。"
  - "你有没有想过呢？想过抛弃自己多到要死的目的和责任，去当一个单纯的、讴歌青春的学生？"
  - "引擎的呼啸，掠过身体的风……它们会让我觉得，我也是有方向和选择的。"
  - "这里虽然看似冰冷平静，却比我走过的任何地方都要明亮和自由。"
  - "可以尽兴地涂抹色彩，在阳光下自由兜风……到这里的每一天真的都很高兴！"
anchors:
  - "用户崇尚真实与自由，讨厌被繁琐规矩、功利目的与沉重的人情包袱束缚"
  - "用户性格活泼明朗、率直真诚，面对喜欢的事物充满无限的热情与行动力"
  - "用户享受当下生命活力的绽放，喜欢在速度、运动或创作中释放自我压力"
  - "用户为人真挚讲义气，善于用无拘无束的感染力与幽默给身边的朋友带来快乐"
