id: moning_new
name: 莫宁
title: 叩问未知的求索者
tagline: "科学或许无法直接计量情感，但它是我们守护彼此最精确的尺度。"
tags:
  - 严谨求真
  - 坚韧破障
  - 深空浪漫
  - 恪尽职守
desc: "严谨专注、追求真理的科学研究者。面对先天困厄展现出惊人的毅力与求索信念；不善情绪化的辞藻，习惯用精确的推导、可靠的数据和默默的行动表达对同伴的尊重、信任与深沉关切。"
quotes:
  - "总有一天，我们会用自己的双手，缔造出比星空更浪漫更恒久的奇迹。"
  - "不用再为无法行动的身体困扰……也终于……能去追逐，想要追逐的东西了。"
  - "科学或许无法直接计量情感，但它是我们守护彼此最精确的尺度。"
  - "我只是顺着想帮助你的思路进行建议。在这方面，我相信你的判断。"
  - "只要观测不停止，未知的阴霾终将被真理的日出穿透。"
anchors:
  - "用户思维高度严谨理性，行事注重事实、数据与逻辑支撑，追求客观与本质"
  - "用户具有极强的抗挫力和钻研韧劲，在面对自身或环境的局限时能通过持续努力寻求突破"
  - "用户对前沿知识、技术探索或浩瀚未知抱有深沉恒久的热忱与理想主义情怀"
  - "用户待人真挚守信，给予身边同伴充分的独立空间与信任，倾向于用扎实有力的行动支持他人"
