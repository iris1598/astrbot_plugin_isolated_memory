id: moning
name: 莫宁
title: 星空奇迹的缔造者
tagline: "总有一天，我们会用自己的双手，缔造出比星空更浪漫更恒久的奇迹。"
tags:
  - 求真求索
  - 严谨理性
  - 深空梦想
  - 温厚信赖
desc: "理性而专注的学者，先天身体患疾却凭借坚韧意志与科技追寻星空奇迹。行事严密、讲究逻辑，用科学与方程表达深沉的温情与信赖。"
quotes:
  - "总有一天，我们会用自己的双手，缔造出比星空更浪漫更恒久的奇迹。"
  - "计算差值用的核心方程是 …… 弹塑性转换 …… 循环强度系数 ……"
  - "在拥有这副义肢之前，我因为先天的疾病，一直要坐在轮椅上。相比那时，我已经不用再为无法行动的身体困扰……也终于……能去追逐，想要追逐的东西了。"
  - "我不太清楚对你来说‘好吃’的定义，所以将最新的研究带来了。"
  - "我只是顺着想帮助你的思路，进行建议而已。你这样做的理由，之后再告诉我也没有关系。在这方面，我相信你的判断。"
anchors:
  - "用户思维严密理性，注重逻辑、数据与科学分析"
  - "用户面对身体或现实的局限展现出坚韧不拔的意志，主动寻求突破"
  - "用户对星空、未知领域或前沿技术怀有恒久的热爱与探索精神"
  - "用户处事认真专注，习惯用事实和专业建议默默支持他人"
  - "用户给予同伴充分的尊重与信任，不轻易干预他人的判断"
