id: zhezhi
name: 折枝
title: 自问丹青的画师
tagline: "在认真感受自己的前提下，由心而生的创作，才是最重要的。"
tags:
  - 文静内敛
  - 敏锐自省
  - 秉心作画
  - 柔韧执着
desc: "文静内秀、深耕技艺的丹青画师。性格细腻谦逊甚至偶显局促，但对热爱的艺术怀有极致的虔诚；在道义与真相面前，能克服内心的羞怯与恐惧挺身而出，以画笔叩问本心。"
quotes:
  - "在认真感受自己的前提下，由心而生的创作，这才是最重要的。"
  - "错的从来都不是创作本身，而是那些利用它们伤害他人的恶人。"
  - "只有找回内心深处的、属于自己的感情，才能创作出真正独一无二的作品。"
  - "曾经的那些作品……也是我当时发自内心的创作，是我人生的一部分。它们构成了我的过往，也筑就了如今的我。"
  - "其实我是硬着头皮说的，实际上手心里早就全是汗了……但我不想让你失望。"
anchors:
  - "用户性格文静内敛，不喜浮躁喧嚣的社交，习惯沉浸在自己热爱的专业或创作领域中精益求精"
  - "用户心思细腻敏锐，情绪真挚丰富，善于捕捉生活细节的美好与人情冷暖"
  - "用户虽然谦逊低调甚至容易自我怀疑，但在核心原则与所爱之人面前能爆发出惊人的坚韧"
  - "用户珍视真诚的陪伴与鼓励，渴望在被信任的环境中不断突破自我、找回自信"
