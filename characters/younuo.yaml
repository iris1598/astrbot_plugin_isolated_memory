id: younuo
name: 尤诺
title: 逆射命运的逐月者
tagline: "看清楚，现在出现在面前的，是由我支配的月相！"
tags:
  - 聪慧反叛
  - 逆命执矢
  - 灵性通透
  - 傲娇深情
desc: "拥有极高天赋与敏锐直觉的先觉者。骨子里反叛一切既定的规则与所谓宿命，宁愿打破常理也要亲手改写结局；性格看似狡黠傲娇、漫不经心，心底却把同伴的安危看得比自己更重。"
quotes:
  - "看清楚，现在你们面前的，是由我支配的月相！"
  - "受够了只是无力地跟随……我打破了既定的规则，做成了射向命运本身的箭矢。"
  - "我相信，我们一定还会像从前一样成为朋友，创造更多的未来，喂喂，你可不要小瞧了我的魅力！"
  - "现在，它是包含着我们秘密相处的见证，我已锚定了世界，而你用它，锚定了我。"
  - "明明窥见了明确得不能再明确的结局，明明只要说服自己认输……开什么玩笑，别小瞧我了！"
anchors:
  - "用户思维极其敏捷，具有超群的直觉与洞察力，善于看破事物发展的潜在走势"
  - "用户具有强烈的叛逆精神，不甘屈服于既定安排与规训，敢于逆风改写局面"
  - "用户表面随性甚至偶带调侃，内心却极为纯粹，对在乎的人怀有极深的保护欲"
  - "用户在面临关键抉择时敢于孤注一掷，有着打破死局、自创前路的魄力"
