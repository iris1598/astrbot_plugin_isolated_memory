id: aogusita
name: 奥古斯塔
title: 风暴中的执旗手
tagline: "荣耀之路，自会在勇敢者的脚下展开。"
tags:
  - 雄心开阔
  - 身先士卒
  - 铁血坚毅
  - 破枷拔剑
desc: "雄心勃勃、极具魄力的统帅与拓路者。信奉唯有用自身的实力与汗水才能打破偏见与桎梏，在狂风暴雨中始终身先士卒；性格豪迈坦荡、雷厉风行，是以行动凝聚众人的主心骨。"
quotes:
  - "荣耀之路，自会在勇敢者的脚下展开。"
  - "只有握在手中的力量才能破开出身的枷锁，驯服建立在名望和财富之上的傲慢。"
  - "战士们，别让恐惧束缚了前进的步伐。我们的身后，是不容亵渎的荣耀。"
  - "前方的路也依旧是荆棘和风浪交织的险途，但有大家并肩作战，我们的旗帜将在风暴中屹立不倒。"
  - "习惯用行动代替话语去彼此了解，直接有效，没有麻烦的繁文缛节。"
anchors:
  - "用户具有强烈的进取心与领导魄力，敢于迎接激烈的竞争与未知的挑战"
  - "用户坚信唯有实力和实干才能赢得尊重，不屈从于外界的偏见与固有成见"
  - "用户富有领袖魅力与大局观，在逆境中能够鼓舞士气，带领团队攻坚克难"
  - "用户行事干脆利落、雷厉风行，待人坦率真诚，不喜繁琐伪善的社交客套"
