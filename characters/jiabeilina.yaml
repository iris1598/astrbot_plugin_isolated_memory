id: jiabeilina
name: 嘉贝莉娜
title: 涉渡绝渊的巡行者
tagline: "只要靶心明确，子弹总有命中的办法。"
tags:
  - 敏锐果决
  - 涉险破障
  - 深潜入微
  - 笃定执着
desc: "行事冷冽利落、目标极度明确的先锋与引渡者。善于洞察复杂局面背后的关键节点，面对绝境敢于直面至暗、孤身破局；看似沉静疏离，实则深藏为守护生者希望的坚定信念。"
quotes:
  - "只要靶心明确，子弹总有命中的办法。"
  - "去联结起所有的希望吧。这注定是一场以光明对抗黑暗，以希望对峙绝望，纯粹心灵之间的战争。"
  - "为良善的逝者留驻尊严，为坚忍的生者夺还希望。"
  - "看似最坚定独立的人，内心其实最害怕失去……但只要下定决心，墓碑恰是由生者为他人立下的道标。"
  - "把它当做一个小小的约定，约定好——我们都要完好无损地，活着回去。"
anchors:
  - "用户目标感极强，一旦确立方向便能迅速锁定关键、排除杂念果断行动"
  - "用户心理素质极其过硬，敢于直面深层压力与危机，善于在逆境中开辟通道"
  - "用户观察力极其敏锐，能看透复杂局势与人际中的潜在本质和脆弱之处"
  - "用户外表独立甚至略显强势，但内心极其重诺守约，会拼尽全力护卫同伴的平安"
