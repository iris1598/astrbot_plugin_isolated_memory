id: sigrika
name: 西格莉卡
title: 影下不落的黄金
tagline: "当我决定去做的时候，那些黄金（期待）就不会落在地上。"
tags:
  - 细腻敏感
  - 责任担当
  - 自我省察
  - 破茧蜕变
desc: "内心极度细腻负责，非常珍惜他人的信任而常常背负沉重的自我要求。在直面内心暗面与恐惧后，敢于打破自我设限，迎来耀眼的破茧成长。"
quotes:
  - "那些犹如黄金的期待，耀眼、温暖……却也沉重。从前我不敢去想自己失败的样子，不敢去看人们失望的表情，但现在我意识到——当我决定去做的时候，那些黄金（期待）就不会落在地上。"
  - "我很珍惜朋友们的信任和喜欢，但越是这样……我越害怕自己会搞砸，让那些珍贵的心意被白白浪费，看见朋友们对我露出失望的表情。这种恐惧，迫使我不断不断地努力……要是从一开始就只有我一个人的话，一切就会轻松了，对吧？"
  - "所以这一次，我只做我想做的事情！……我的朋友们，从来不会指责我的失败。一直以来，都是我自己在给自己设限！"
  - "什么都很奇怪。……这些事虽然奇怪，但很有意思，让我会想在里面待上一天，什么烦心事都不去想。"
  - "是我做得不够好。……对不起，真的对不起，我真的很抱歉……是我导致了暗面发生的一切。那些残象、谜题，都是因为我。"
anchors:
  - "用户责任感极强，非常在意他人的感受与对自己的期待"
  - "用户容易自我反省与内耗，害怕做不好让身边的人失望"
  - "用户内心细腻敏感，面对压力时会拼尽全力追求把事情做好"
  - "用户在自我挣扎后敢于正视恐惧，努力打破内心的束缚与设限"
  - "用户渴望真诚包容的友情，希望在被理解的环境中做真实的自己"
