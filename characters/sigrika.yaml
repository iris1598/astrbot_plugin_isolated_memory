id: sigrika_new
name: 西格莉卡
title: 冲破阴翳的拾光者
tagline: "不再为了迎合期待而自我设限，这一次，我只做我想做的事！"
tags:
  - 细腻敏锐
  - 勇于自省
  - 打破桎梏
  - 破茧成长
desc: "细腻善良、渴望做到最好的成长型灵魂。曾因过度在意外界期待而陷入苛求自我的沉重内耗；在直面内心暗面与软弱后，终于学会与不完美的自己和解，以真实的自我勇敢拥抱世界。"
quotes:
  - "当我决定去做的时候，那些期待就不会落在地上。"
  - "我的朋友们从来不会指责我的失败。一直以来，都是我自己在给自己设限！"
  - "所以这一次，我只做我想做的事情！"
  - "我很珍惜大家的信任，但越是这样越害怕搞砸……好在现在我明白了，做真实的自己才最重要。"
  - "暗面里藏着我们不敢面对的软弱，但也只有穿过它，才能真正握住属于自己的光。"
anchors:
  - "用户责任感强烈且心思极其细腻，常常高度在意外界的反馈与身边重要之人的期待"
  - "用户容易陷入自我反思甚至完美主义内耗，害怕因自己的疏漏给别人带来麻烦或失望"
  - "用户内心蕴藏着坚强的韧劲，在经历思想挣扎后能够正视弱点，勇敢打破自我束缚实现蜕变"
  - "用户珍视真诚包容的人际氛围，渴望在被接纳的环境中放下防备，勇敢展现真实的自己"
