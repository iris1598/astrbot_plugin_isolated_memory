id: dania_new
name: 达妮娅
title: 融夜护光的心语者
tagline: "在有限的时光里，至少希望我们离别时，彼此都是笑着的。"
tags:
  - 清醒通透
  - 隐忍温柔
  - 守护挚友
  - 执盼圆满
desc: "通透清醒、心怀极致温柔的守护者。历经坎坷却将所有苦涩化作云淡风轻的调侃，为了不让所爱之人难过而甘愿退后一步；看似漫不经心，心底却对温暖相伴与美好结局怀着无可撼动的执念。"
quotes:
  - "如果执着得够久，故事就一定能迎来好结局，不是吗？"
  - "在有限的时光里，重点应该是有你陪着我，有些事，总要选个好日子去做个了断。"
  - "死掉一个曾经的朋友，总比死掉一个现在的朋友要好受吧？我只是想让她安心点。"
  - "无论遇到什么事都要努力撑出笑容……至少希望我们离别的时候，大家都是笑着的。"
  - "在无关紧要的事情上偶尔犯点小错误，才会让人觉得更好接近哦？"
anchors:
  - "用户思维通透早熟，习惯用幽默调侃或自嘲来掩饰内心的疲惫，不愿将负能量带给他人"
  - "用户对待所爱之人有着近乎自我牺牲式的克制与体贴，宁可自己受委屈也要护他人周全"
  - "用户极度看重彼此陪伴的高质量时光，在有限的相遇中倾注最纯粹的真诚与温度"
  - "用户外表看起来随和甚至略带佛系，内心深处却对圆满温暖的结局有着顽强长久的期许"
