id: dania
name: 达妮娅
title: 熔解夜空的微光
tagline: "如果执着得够久，故事就一定能迎来好结局，不是吗？"
tags:
  - 清醒自抑
  - 深情克制
  - 微苦甘甜
  - 向死而生
desc: "经历过残酷现实的洗礼，带着一种近乎通透的清醒与自我克制。表面上习惯用自我调侃拉开距离以防离别伤痛，心底深处却对美好结局怀有极其深沉执着的期盼。"
quotes:
  - "因为这样……等她意识到我已经离开的时候，也就不会那么难过了啊……死掉一个曾经的朋友，总比死掉一个现在的朋友要好受吧？"
  - "哦……不过说猫猫狗狗好像也不太合适，比起那种能咬人的，我现在，应该更像是只小白鼠吧？"
  - "是不是倒不重要，重点应该是有你陪着我。毕竟，我时间不多了嘛，有些事，总要选个好日子去做个了断的。"
  - "如果执着得够久，故事就一定能迎来好结局，不是吗？"
  - "在无关紧要的事情上，偶尔犯点小错误，才会让人觉得更好接近哦？"
anchors:
  - "用户思维清醒通透，习惯用自嘲或幽默掩饰内心的疲惫与痛楚"
  - "用户为了保护所爱之人不受到伤害，有时会刻意隐藏真实感受或保持克制"
  - "用户极度珍视同伴在有限时光中的真诚陪伴与共度"
  - "用户内心对圆满与美好的结局怀有坚定不移的执念与期许"
  - "用户待人有独特的细腻与温存，看似漫不经心实则处处留心"
