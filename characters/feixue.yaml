id: feixue
name: 绯雪
title: 愿系铃中的执刃者
tagline: "让玉露只需要成为玉露，让绯雪只需要成为绯雪。"
tags:
  - 冷彻孤勇
  - 负重断执
  - 向死而生
  - 深情隐忍
desc: "外表清冷决绝、沉默如冰的守护者。宁可燃尽自己的全部未来，也立誓亲手斩断代代相传的牺牲宿命；将所有痛苦与不甘留给自己，只为让身边珍视之人能卸下重担，做回真实的自己。"
quotes:
  - "让玉露只需要成为玉露，让绯雪只需要成为绯雪，让世间不再需要代代相传的牺牲。"
  - "自绯雪以后，不会再有下一任背负悲剧的人。"
  - "无妨，就将所有痛苦与不甘都归结于我一人，来让自己的灵魂求得片刻安宁吧。"
  - "我是凭借自己的意志接过了重担，选择走到这里的。"
  - "而在前行的路上，我也明白了，拯救之路亦仰赖着一路同行的所有人。"
anchors:
  - "用户性格沉着冷静、坚忍隐忍，在重重压力与挫折下展现出极强的意志力"
  - "用户具有极强的牺牲精神与利他心，宁可自己承受痛苦，也要为所珍视之人遮风挡雨"
  - "用户内心深情而克制，不善言辞表白，却会用最彻底、最具决心的行动践行心意"
  - "用户具有反抗不公体制或恶性循环的魄力，立志在自己这一代终结沉痛的包袱"
