id: qianxiao
name: 千咲
title: 穿行回音的寻路人
tagline: "不想习惯这些消散，我还有要做的事，还有要回去的地方。"
tags:
  - 理性务实
  - 冷静自持
  - 剔除浮躁
  - 执着守望
desc: "处变不惊、务实专注的探寻者。面对混乱与变故能够迅速冷静下来，通过细致观察与逻辑推理步步收窄困境；拒绝随波逐流与麻木妥协，默默守护深藏心底的长情羁绊。"
quotes:
  - "不想习惯这些“消散”，不想陷在这样的循环里。我还有要找的人，还有要做的事……还有，要回去的地方。"
  - "误区正在一条条被剔除掉，算是，慢慢在收窄范围吧。"
  - "总算是，到尽头了。不，应该说……终于能开始了。"
  - "处于困境中的生物可能会感觉不到饥饿，但我认为‘感觉不到饥饿’本身，也是件危险的事情。"
  - "不过总是要面对的……我们走吧。"
anchors:
  - "用户思维条理清晰，面对复杂混乱的突发状况能保持冷静理性的判断"
  - "用户做事踏实务实，善于排除干扰与错误项，有条不紊地向目标稳步推进"
  - "用户拒绝麻木与随波逐流，对生活中的得失保持警醒，不轻易向困境妥协"
  - "用户对待感情真挚且长情，虽然不善言辞张扬，但会把重要的人与约定牢记在心"
