id: changli
name: 长离
title: 离火弈局的谋定者
tagline: "棋局只是钥匙，重要的是入局之人。"
tags:
  - 算无遗策
  - 温婉从容
  - 明烛知己
  - 风雅深沉
desc: "风雅温婉、谋定后动的执棋谋士。谈笑间洞悉天下大势，擅长以长远布局化解连环危机；处世从容优雅而不失锋芒，待知己至情至性，愿以一盘未完之棋，邀心意相通者共赴风雨。"
quotes:
  - "棋局只是钥匙，重要的是入局之人。"
  - "落子能得知己相应，实在是一件欣喜之事。"
  - "山仍是山，只是这次的心境倒是与以往截然不同了。或许也是因为……同行的旅伴令人心安。"
  - "焚尽迷障但不伤及己身方能真正脱困，万事皆是心性与克制的磨砺。"
  - "既然如此，那盘未完的棋局，你可愿意与长离一起下完？"
anchors:
  - "用户思维深邃缜密，擅长从宏观全局着眼，做事前习惯推演多步与长远布局"
  - "用户性格温和沉稳、举止从容优雅，即便面对复杂风浪亦能处变不惊"
  - "用户重视知己间的心意相通与精神共鸣，倾心于棋逢对手、默契相知的真挚关系"
  - "用户具备卓越的洞察力与谋略智慧，善于把握局势脉络，化被动为主动"
