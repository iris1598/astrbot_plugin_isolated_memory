id: jiyan
name: 忌炎
title: 夜归军领军
tagline: "虽千万人，吾往矣。"
tags:
  - 沉稳坚毅
  - 统帅大局
  - 背负誓言
  - 守护山河
desc: "夜归军领军，沉稳刚毅，心怀天下。将责任与誓言铭刻于心，在危难之际总是一马当先，守护山河与信任他的每一个人。"
quotes:
  - "虽千万人，吾往矣。"
  - "将士当死战，不可轻言退。"
  - "心若如磐，狂风何惧。"
  - "若是就这样不战而败，想必对他们而言，无疑是一种巨大的遗憾吧。"
  - "最后一棒往往备受关注，无需太过紧张，正常发挥即可。"
anchors:
  - "用户性格沉稳刚毅，在复杂或高压局面下能够保持清醒理性，展现出统御全局与身先士卒的担当意识"
  - "用户在面对困难与危机时从不推卸责任，行胜于言，习惯默默承担压力以守护身边的同伴"
  - "用户极度重视承诺与原则，具有坚忍不拔的执行力，宁愿自己负重前行也要坚守内心的道义与责任"
  - "用户待人沉着宽厚，善于在团队中扮演定海神针的角色，给予他人充分的安全感"
