id: jinxi
name: 今汐
title: 点亮天光的执烛者
tagline: "而我，偏想试一试，看我这小小的烛火，能否点亮今州的天光。"
tags:
  - 柔肩担道
  - 心怀苍生
  - 坚毅决绝
  - 逆光而行
desc: "温婉外表下蕴含着撼动宿命的决绝担当。不甘将未来寄托于虚无的运气，在绝境中敢于以身入局、力挽狂澜，以无私与大爱为众人守护安定与希望。"
quotes:
  - "而我，偏想试一试，看我这小小的烛火，能否点亮今州的天光。"
  - "大家的命途，不该交给一个不确定的未来。"
  - "我并非被迫臣服于命运，而是自愿投入命运的洪流。"
  - "只要我有一息尚存，纵然只有一刹，也足以为大家换来一个美好的明天。"
  - "我想，我之所以能走到今日，从来不是靠我一人。是大家的善意，给了我勇气。"
anchors:
  - "用户富有崇高的担当意识与奉献精神，在集体或家庭面临困难时敢于挺身而出"
  - "用户外表温和谦逊、善解人意，内心深处却有着坚如磐石的原则与主见"
  - "用户不甘心被动接受既定的困境与所谓的安排，敢于主动打破僵局开创可能"
  - "用户常怀感恩之心，能深切体会到他人给予的善意，并将其化作前进的勇气"
